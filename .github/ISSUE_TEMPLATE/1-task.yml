name: Task
description: Work to do (the default)
type: Task
projects: ["sleepacta/1"]
body:
  - type: markdown
    attributes:
      value: "Commits for this issue: `GH-<number> Title` (the number next to the title, once created). Add `fixes #<number>` when the commit closes it. Area, Priority and Sprint: in the sidebar or in the Sleepacta project. See CONTRIBUTING."
  - type: textarea
    id: what
    attributes:
      label: What
      description: Optional. What needs doing and why.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Optional. How we know it is finished.
