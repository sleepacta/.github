name: Bug
description: Qualcosa non funziona come dovrebbe
type: Bug
projects: ["sleepacta/1"]
body:
  - type: markdown
    attributes:
      value: "Nei commit per questo ticket: `GH-<numero> Titolo` (il numero è quello accanto al titolo, dopo la creazione). Aggiungi `fixes #<numero>` se il commit lo chiude. Vedi CONTRIBUTING."
  - type: textarea
    id: what
    attributes:
      label: Cosa succede
      description: Facoltativo. Cosa hai visto, con messaggi di errore o screenshot.
  - type: textarea
    id: expected
    attributes:
      label: Cosa dovrebbe succedere
  - type: textarea
    id: steps
    attributes:
      label: Come riprodurlo
      description: Facoltativo. Passi, ID esame, utente, link.
  - type: dropdown
    id: env
    attributes:
      label: Ambiente
      options: [Produzione, Testing, Locale]
