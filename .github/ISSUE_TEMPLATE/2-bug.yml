name: Bug
description: Something does not work as it should
type: Bug
projects: ["sleepacta/1"]
body:
  - type: markdown
    attributes:
      value: "Commits for this issue: `GH-<number> Title` (the number next to the title, once created). Add `fixes #<number>` when the commit closes it. Area, Priority and Sprint: in the sidebar or in the Sleepacta project. See CONTRIBUTING."
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Optional. What you saw, with error messages or screenshots.
  - type: textarea
    id: expected
    attributes:
      label: What should happen
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: Optional. Steps, exam ID, user, links.
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options: [Production, Testing, Local]
