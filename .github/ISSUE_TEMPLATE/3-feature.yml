name: Feature
description: A new feature or a change to an existing one
type: Feature
projects: ["sleepacta/1"]
body:
  - type: markdown
    attributes:
      value: "Commits for this issue: `GH-<number> Title` (the number next to the title, once created). Add `fixes #<number>` when the commit closes it. Area, Priority and Sprint: in the sidebar or in the Sleepacta project. See CONTRIBUTING."
  - type: textarea
    id: what
    attributes:
      label: What is needed
      description: Optional. What the user must be able to do.
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Optional. Who asks for it, what problem it solves.
